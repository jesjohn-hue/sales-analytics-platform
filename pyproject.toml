[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-analytics-platform"
version = "0.1.0"
description = "End-to-end PostgreSQL sales analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "plotly>=6.0,<7.0",
    "streamlit>=1.48,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
generate-sales-data = "sales_analytics.pipeline.generate:main"
load-sales-warehouse = "sales_analytics.pipeline.load:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring an explicitly enabled PostgreSQL database",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
